<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />

    <title>Frontend Mentor | Product list with cart</title>
  </head>
  <body>
    <main>
      <section class="products">
        <h1 class="products-title">Dessert</h1>
        <div class="products-grid"></div>
      </section>
      <section class="cart">
        <h2 class="cart-title">
          Your Cart(<span aria-live="polite" id="cart-count">0</span>)
        </h2>
        <div class="cart-empty">
          <img src="./assets/images/illustration-empty-cart.svg" alt="" />
          <p class="cart-empty-text">Your added items will appear here</p>
        </div>

        <div class="cart-details">
          <ul class="cart-items">
            <li class="cart-item">
              <div class="cart-item-details">
                <h3 class="cart-item-name">Classic Tiramisu</h3>
                <div>
                  <span class="cart-item-quantity">4x</span>
                  <span class="cart-item-price">@$5.66</span>
                  <span class="cart-item-total-price">$5.66</span>
                </div>
              </div>
              <button
                aria-label="Remove item from cart"
                class="cart-remove-item"
              >
                <svg
                  aria-hidden="true"
                  focusable="false"
                  xmlns="http://www.w3.org/2000/svg"
                  width="10"
                  height="10"
                  fill="none"
                  viewBox="0 0 10 10"
                >
                  <path
                    fill="currentColor"
                    d="M8.375 9.375 5 6 1.625 9.375l-1-1L4 5 .625 1.625l1-1L5 4 8.375.625l1 1L6 5l3.375 3.375-1 1Z"
                  />
                </svg>
              </button>
            </li>

            <li class="cart-item">
              <div class="cart-item-details">
                <h3 class="cart-item-name">Classic Tiramisu</h3>
                <div>
                  <span class="cart-item-quantity">4x</span>
                  <span class="cart-item-price">@$5.66</span>
                  <span class="cart-item-total-price">$5.66</span>
                </div>
              </div>
              <button
                aria-label="Remove item from cart"
                class="cart-remove-item"
              >
                <svg
                  aria-hidden="true"
                  focusable="false"
                  xmlns="http://www.w3.org/2000/svg"
                  width="10"
                  height="10"
                  fill="none"
                  viewBox="0 0 10 10"
                >
                  <path
                    fill="currentColor"
                    d="M8.375 9.375 5 6 1.625 9.375l-1-1L4 5 .625 1.625l1-1L5 4 8.375.625l1 1L6 5l3.375 3.375-1 1Z"
                  />
                </svg>
              </button>
            </li>
          </ul>

          <div class="order-total">
            <p>Order Total</p>
            <p class="order-total-price">$46.50</p>
          </div>

          <div class="carbon-neutral">
            <img
              src="./assets/images/icon-carbon-neutral.svg"
              alt=""
              class="caborn-neutral-image"
            />
            <p class="carbon-neutral-text">
              This is a <span>carbon-neutral</span> delivery
            </p>
          </div>

          <button class="order-btn">Confirm Order</button>
        </div>
      </section>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by
      <a href="https://github.com/theoroszlan">Itumeleng Junior Manganye</a>.
    </footer>

    <script src="script.js"></script>
  </body>
</html>
