<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />

    <title>Frontend Mentor | Product list with cart</title>
  </head>
  <body>
    <main>
      <section class="products">
        <h1 class="products-title">Dessert</h1>
        <div class="products-grid"></div>
      </section>
      <section class="cart">
        <h2 class="cart-title">
          Your Cart(<span aria-live="polite" id="cart-count">0</span>)
        </h2>
        <div class="cart-empty">
          <img src="./assets/images/illustration-empty-cart.svg" alt="" />
          <p>Your added items will appear here</p>
        </div>

        <div class="cart-details">
          <ul class="cart-items"></ul>

          <div class="order-total">
            <p>Order Total</p>
            <p class="order-total-price"></p>
          </div>

          <div class="carbon-neutral">
            <img src="./assets/images/icon-carbon-neutral.svg" alt="" />
            <p class="carbon-neutral-text">
              This is a <span>carbon-neutral</span> delivery
            </p>
          </div>

          <button type="button" class="order-btn confirm-order-btn">
            Confirm Order
          </button>
        </div>
      </section>
      <dialog class="order-confirmed" aria-labelledby="order-confirmed-title">
        <img
          src="./assets/images/icon-order-confirmed.svg"
          alt=""
          aria-hidden="true"
          class="order-confirmed-image"
        />
        <div>
          <h2 id="order-confirmed-title">Order Confirmed</h2>
          <p class="order-confirmed-text">We hope you enjoy your food!</p>
        </div>
        <div class="order-summary">
          <ul class="order-summary-grid"></ul>
          <div class="order-total">
            <p>Order Total</p>
            <p class="order-total-price" id="order-confirmed-total-price"></p>
          </div>
        </div>
        <button type="button" class="order-btn new-order-btn">
          Start New Order
        </button>
      </dialog>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by
      <a href="https://github.com/theoroszlan">Itumeleng Junior Manganye</a>.
    </footer>

    <script src="script.js"></script>
  </body>
</html>
